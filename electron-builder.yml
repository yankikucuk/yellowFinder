# Packaging and publishing configuration for electron-builder.
# See docs/adr/0003-updates-and-releases.md for the release flow.

appId: com.yankikucuk.yellowfinder
productName: yellowFinder
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - package.json
  - src/main/**
  - src/preload/**
  - src/shared/**
  - dist/renderer/**

# Releases are published to GitHub; electron-updater reads the same block.
publish:
  provider: github
  owner: yankikucuk
  repo: yellowFinder
  releaseType: release

mac:
  category: public.app-category.utilities
  icon: build/icon-mac.png
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  category: Utility
  maintainer: kendinikertenkelebek@me.com
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
