name: Release

# Pushing a tag such as v0.1.0 builds installers for macOS, Windows and Linux
# and publishes them to a GitHub release of the same name. electron-updater
# in installed apps reads that release to offer the update.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:renderer
      - name: Package and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple signing identity is configured yet; skip code signing on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
